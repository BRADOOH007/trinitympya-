    <!-- Structured Data: BusTrip (Nairobi → Kampala) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BusTrip",
      "name": "Nairobi to Kampala Bus",
      "description": "Daily direct bus service from Nairobi, Kenya to Kampala, Uganda with Trinity Express Bus.",
      "provider": {
        "@type": "Organization",
        "name": "Trinity Express Bus",
        "url": "https://traveltrinityexpress.online"
      },
      "departureBusStop": {
        "@type": "BusStop",
        "name": "Trinity Express Nairobi Terminal",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Duruma Road",
          "addressLocality": "Nairobi",
          "addressCountry": "KE"
        }
      },
      "arrivalBusStop": {
        "@type": "BusStop",
        "name": "Trinity Express Kampala Terminal",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Namirembe Road, Bakuli",
          "addressLocality": "Kampala",
          "addressCountry": "UG"
        }
      },
      "departureTime": "06:00",
      "offers": {
        "@type": "Offer",
        "price": "3500",
        "priceCurrency": "KES",
        "availability": "https://schema.org/InStock",
        "url": "https://traveltrinityexpress.online/routes/nairobi-kampala"
      }
    }
    </script>

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Trinity Express Bus",
      "url": "https://traveltrinityexpress.online",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://traveltrinityexpress.online/routes?from={origin}&to={destination}"
        },
        "query-input": "required name=origin required name=destination"
      }
    }
    </script>
